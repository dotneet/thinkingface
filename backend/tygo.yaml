# tygo turns the Go wire-contract structs into TypeScript, so the frontend
# types follow the backend automatically instead of being kept in step by
# hand. Regenerate with `make gen-types` (see backend/scripts/gen-types.sh).
#
# Only internal/apitypes is scanned: it holds the JSON shapes and nothing
# else, so everything it declares belongs in the output. Packages whose
# result type *is* a wire shape alias the declaration there rather than
# defining their own, which keeps one definition per field.
packages:
  - path: "github.com/dotneet/thinkingface/backend/internal/apitypes"
    output_path: "../frontend/types/api.gen.ts"
    indent: "  "
    # Only type comments: the package doc comment explains the Go side of the
    # arrangement and means nothing to a TypeScript reader.
    preserve_comments: "types"
    # String-typed const groups become unions ("dataset" | "model") rather
    # than a loose `string` plus a pile of exported constants.
    enum_style: "union"
    # An unmapped Go type would silently become `any`; there should be none.
    fallback_type: "unknown"
    type_mappings:
      # encoding/json renders time.Time as an RFC 3339 string.
      time.Time: "string"
    frontmatter: |
      // Generated from the Go structs in backend/internal/apitypes.
      // Do not edit this file by hand -- run `make gen-types` instead.
