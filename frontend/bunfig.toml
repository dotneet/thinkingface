# bun install policy. See docs/dev/supply-chain.md for the reasoning.

[install]
# Minimum release age (seconds): only versions that have been public on the
# registry for at least 7 days are candidates for resolution.
#
# This is the cheap defence against the npm attack pattern where a maintainer
# account is taken over, a malicious patch release is published, and everyone
# who runs `bun update` in the next few hours ships it. A week is long enough
# that such a release is usually yanked before it can be resolved here.
#
# It only affects *resolution* (`bun add` / `bun update` / a cold install with
# no lockfile). `bun install --frozen-lockfile`, which is what CI and the
# Docker build run, installs exactly what bun.lock already pins and is not
# influenced by this setting.
#
# renovate.json sets the same 7 days, so the two agree on what is too fresh.
# The quarantine here also applies when Renovate refreshes bun.lock, and it
# applies to an exactly pinned version too -- so a Renovate security PR (which
# is exempt on Renovate's side) fails its lockfile update while the fix is
# younger than a week. Regenerate it on that PR branch with
# `bun install --minimum-release-age=0`, which resolves the version Renovate
# already wrote into package.json.
#
# To take a fresh release on purpose (a security fix you are bumping yourself),
# override it for that one command:
# `bun update <pkg> --minimum-release-age=0`. It has to be the flag: on bun
# 1.4.0 the BUN_CONFIG_MINIMUM_RELEASE_AGE environment variable has no effect.
minimumReleaseAge = 604800
