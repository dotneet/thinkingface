# lefthook: lightweight pre-commit checks via git hooks.
#
# ★ This is opt-in. Installing it is not enforced.
#   Only those who want it need run one of the following:
#
#     lefthook install                 # if you already have lefthook installed
#     bunx lefthook install            # to use it ad hoc via bun
#
#   To stop, run `lefthook uninstall`.
#   CI (.github/workflows/ci.yml) and `make check` are the authoritative
#   checks; this hook is nothing more than early feedback before a commit.
#   To skip it temporarily, use `git commit --no-verify`.

pre-commit:
  parallel: true
  commands:
    # --- Go: check whether staged .go files are gofmt'd (does not rewrite them) ---
    #
    # It matters that this is `unformatted="$(...)" && if ...`, not `;`:
    # with `;`, a failure of gofmt itself (an unparseable file, a vanished
    # path) leaves the variable empty and the check silently passes.
    # `--` keeps filenames starting with a hyphen from being mistaken for flags.
    # {staged_files} is quoted appropriately by lefthook itself (confirmed
    # safe even for names containing spaces or `;`).
    go-fmt:
      root: backend/
      glob: "*.go"
      run: |
        unformatted="$(gofmt -l -- {staged_files})" && \
        if [ -n "$unformatted" ]; then
          echo "Files needing gofmt:"
          echo "$unformatted"
          echo "-> run 'make fmt' or 'gofmt -w'"
          exit 1
        fi

    # --- TypeScript / CSS / JSON: oxfmt format check + oxlint ----------------
    frontend-oxc:
      root: frontend/
      glob: "*.{ts,tsx,js,jsx,mjs,cjs,json,css}"
      # Only the binaries from node_modules, i.e. the versions bun.lock pins.
      # No `bunx` fallback: that fetches whatever the registry serves at that
      # moment and runs it on your working tree -- exactly the unpinned
      # install docs/dev/supply-chain.md rules out.
      #
      # oxfmt only *checks* here. A pre-commit hook that rewrites files is a
      # hook that silently commits something you did not read.
      #
      # Neither tool is handed {staged_files}, and that is deliberate. Both
      # exit non-zero when the list they are given contains nothing they can
      # work on, and neither distinguishes that from a real failure:
      #
      #   - `oxlint frontend/app/globals.css` exits 1 with "No files found to
      #     lint", because oxlint only reads JS/TS while this hook's glob also
      #     matches .css and .json -- so a commit that touches only a
      #     stylesheet would be blocked;
      #   - `oxfmt --check frontend/types/api.gen.ts` exits 2 with "Expected at
      #     least one target file", because .oxfmtrc.json ignores generated
      #     types on purpose -- so a plain `make gen-types` commit would be
      #     blocked too.
      #
      # `biome check` used to absorb both cases on its own. Running each tool
      # over the whole frontend instead sidesteps the question, and costs
      # nothing worth measuring: oxfmt ~0.1s and oxlint ~0.14s across all 409
      # files. The glob above still decides *whether* the hook runs at all.
      run: |
        if [ -x node_modules/.bin/oxfmt ] && [ -x node_modules/.bin/oxlint ]; then
          ./node_modules/.bin/oxfmt --check . && \
          ./node_modules/.bin/oxlint
        else
          echo "skip: oxfmt/oxlint not found (cd frontend && bun install)"
        fi

    # --- TypeScript: UI consistency check (detects off-token colors, raw <button>, etc.) ---
    frontend-check-ui:
      root: frontend/
      glob: "*.{ts,tsx}"
      run: node scripts/check-ui.mjs

    # --- Terraform: fmt check for staged .tf files (does not rewrite them) ---
    #
    # fmt only. `terraform validate` needs an initialised infra/.terraform and
    # a provider download, which is too much for a pre-commit hook -- it stays
    # in `make check-terraform` and the CI terraform job.
    terraform-fmt:
      root: infra/
      glob: "*.tf"
      run: |
        if terraform version >/dev/null 2>&1; then
          terraform fmt -check -- {staged_files}
        else
          echo "skip: terraform not found"
        fi

    # --- Python: ruff lint ----------------------------------------------------
    python-ruff:
      glob: "*.py"
      # The pinned ruff from requirements-lint.txt, the same one `make lint`
      # and CI use -- not whatever `ruff` is on PATH (a stale local version
      # passing while CI's fails is the reason the Makefile stopped doing
      # that) and not an unpinned `uvx ruff` download.
      run: |
        if uv --version >/dev/null 2>&1; then
          uv run --isolated --with-requirements requirements-lint.txt ruff check {staged_files}
        else
          echo "skip: uv not found (https://docs.astral.sh/uv/getting-started/installation/)"
        fi
