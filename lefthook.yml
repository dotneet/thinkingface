# lefthook: lightweight pre-commit checks via git hooks.
#
# ★ This is opt-in. Installing it is not enforced.
#   Only those who want it need run one of the following:
#
#     lefthook install                 # if you already have lefthook installed
#     bunx lefthook install            # to use it ad hoc via bun
#
#   To stop, run `lefthook uninstall`.
#   CI (.github/workflows/ci.yml) and `make check` are the authoritative
#   checks; this hook is nothing more than early feedback before a commit.
#   To skip it temporarily, use `git commit --no-verify`.

pre-commit:
  parallel: true
  commands:
    # --- Go: check whether staged .go files are gofmt'd (does not rewrite them) ---
    #
    # It matters that this is `unformatted="$(...)" && if ...`, not `;`:
    # with `;`, a failure of gofmt itself (an unparseable file, a vanished
    # path) leaves the variable empty and the check silently passes.
    # `--` keeps filenames starting with a hyphen from being mistaken for flags.
    # {staged_files} is quoted appropriately by lefthook itself (confirmed
    # safe even for names containing spaces or `;`).
    go-fmt:
      root: backend/
      glob: "*.go"
      run: |
        unformatted="$(gofmt -l -- {staged_files})" && \
        if [ -n "$unformatted" ]; then
          echo "Files needing gofmt:"
          echo "$unformatted"
          echo "-> run 'make fmt' or 'gofmt -w'"
          exit 1
        fi

    # --- TypeScript / CSS / JSON: Biome format + lint check ------------------
    frontend-biome:
      root: frontend/
      glob: "*.{ts,tsx,js,jsx,mjs,json,css}"
      run: |
        if [ -x node_modules/.bin/biome ]; then
          ./node_modules/.bin/biome check {staged_files}
        elif bunx --version >/dev/null 2>&1; then
          bunx --bun @biomejs/biome check {staged_files}
        else
          echo "skip: biome not found (cd frontend && bun install)"
        fi

    # --- TypeScript: UI consistency check (detects off-token colors, raw <button>, etc.) ---
    frontend-check-ui:
      root: frontend/
      glob: "*.{ts,tsx}"
      run: node scripts/check-ui.mjs

    # --- Terraform: fmt check for staged .tf files (does not rewrite them) ---
    #
    # fmt only. `terraform validate` needs an initialised infra/.terraform and
    # a provider download, which is too much for a pre-commit hook -- it stays
    # in `make check-terraform` and the CI terraform job.
    terraform-fmt:
      root: infra/
      glob: "*.tf"
      run: |
        if terraform version >/dev/null 2>&1; then
          terraform fmt -check -- {staged_files}
        else
          echo "skip: terraform not found"
        fi

    # --- Python: ruff lint ----------------------------------------------------
    python-ruff:
      glob: "*.py"
      run: |
        if ruff --version >/dev/null 2>&1; then
          ruff check {staged_files}
        elif uvx ruff --version >/dev/null 2>&1; then
          uvx ruff check {staged_files}
        else
          echo "skip: ruff / uvx not found (pip install ruff)"
        fi
