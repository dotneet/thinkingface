name: security

# Known-vulnerability scanning for the dependency tree: govulncheck for Go,
# bun audit for the frontend, pip-audit for the Python requirement sets.
# This is `make audit` -- the same command, the same pinned scanner versions,
# the same accepted-advisory list -- so a developer can reproduce a failure
# locally without guessing at flags.
#
# It runs weekly because that is the part CI cannot do on demand: an advisory
# published today applies to code that has not changed since last month. The
# manifest-scoped pull_request trigger catches the other direction, a change
# that pulls in something already known to be vulnerable.

on:
  schedule:
    # Mondays, 02:17 UTC. Off the hour on purpose: GitHub's scheduler queues
    # heavily at :00 and delays or drops those runs.
    - cron: "17 2 * * 1"
  pull_request:
    paths:
      - "backend/go.mod"
      - "backend/go.sum"
      - "frontend/package.json"
      - "frontend/bun.lock"
      - "frontend/bunfig.toml"
      - "docs/requirements.in"
      - "docs/requirements.txt"
      - "requirements-lint.in"
      - "requirements-lint.txt"
      - "e2e/pyproject.toml"
      - "e2e/uv.lock"
      - "Makefile"
      - ".github/workflows/security.yml"
  push:
    branches: [main]
    paths:
      - "backend/go.mod"
      - "backend/go.sum"
      - "frontend/package.json"
      - "frontend/bun.lock"
      - "frontend/bunfig.toml"
      - "docs/requirements.in"
      - "docs/requirements.txt"
      - "requirements-lint.in"
      - "requirements-lint.txt"
      - "e2e/pyproject.toml"
      - "e2e/uv.lock"
      - "Makefile"
      - ".github/workflows/security.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: audit (govulncheck / bun audit / pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions are pinned to a commit SHA, not a tag: a tag is a mutable
      # pointer the action's owner (or anyone who takes over the account) can
      # move to arbitrary code. The trailing comment is the human-readable
      # version, and Renovate keeps SHA and comment in step.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes, and every step below runs third-party tooling.
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.5"

      # Informational and non-blocking: the full picture, including the
      # advisories make audit accepts. Read this when the blocking step below
      # goes green but the accepted list needs revisiting.
      #
      # `|| true` rather than continue-on-error. Both let the job succeed, but
      # continue-on-error still records the step's non-zero exit as a failure
      # annotation, so a green run carries a red "Process completed with exit
      # code 1" that reads as a broken security scan at a glance. This step
      # finding something is the normal case -- it belongs in the log, not in
      # the run's status.
      - name: bun audit (full report, informational)
        working-directory: frontend
        run: bun audit || true

      - name: make audit
        run: make audit
