name: CI

# Every `uses:` below is pinned to a commit SHA rather than a tag. A tag is a
# mutable pointer: whoever controls the action's repository -- its owner, or
# whoever takes the account over -- can move `v4` onto different code, and it
# would run here with the workflow's token and the checked-out source. The
# trailing `# vX.Y.Z` comment is the human-readable version, and Renovate
# (renovate.json) keeps the SHA and the comment in step. Base images are
# pinned the same way, by digest. See docs/dev/supply-chain.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which of the heavy jobs below this pull request actually needs. Done with
  # `git diff` rather than a paths-filter action so the workflow keeps its
  # dependency surface at zero third-party actions beyond checkout itself
  # (docs/dev/supply-chain.md), and job-level rather than workflow-level `on:
  # paths:` because that would gate *every* job, not just this one.
  changes:
    name: changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only a pull request has two commits to compare. Every other event
    # decides from the event itself (see the e2e job's `if`).
    if: github.event_name == 'pull_request'
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole history: the diff is taken against the merge base, which
          # a shallow clone would not have.
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # Against the merge base, not the base branch tip: main moving ahead
          # while the pull request is open must not make its own commits look
          # like part of this diff.
          base=$(git merge-base "$BASE" "$HEAD")
          changed=$(git diff --name-only "$base" "$HEAD")
          echo "changed files:"
          echo "$changed"
          # Anything the compatibility suite actually exercises: the server
          # itself, the suite, and the compose files it is run against. A
          # false positive here costs one job; a false negative lets an
          # HF-compatibility regression through (CLAUDE.md invariant 5).
          if echo "$changed" | grep -qE '^(backend/|e2e/|docker-compose[^/]*\.yml$|\.github/workflows/ci\.yml$)'; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: backend (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    # Of backend/internal/store's integration tests, the PostgreSQL path only
    # runs when TF_TEST_DATABASE_URL is set (otherwise only SQLite runs).
    # CI always brings up this service so both paths get exercised.
    services:
      postgres:
        # Digest-pinned like the compose file's copy of the same image.
        image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
        env:
          POSTGRES_USER: tf
          POSTGRES_PASSWORD: tf
          POSTGRES_DB: thinkingface
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U tf -d thinkingface"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Do not leave the job's GITHUB_TOKEN in .git/config: nothing here
          # pushes, and the later steps run third-party tooling (tygo, bun,
          # pip, docker build) that would otherwise have a credential within
          # reach.
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::Some files need gofmt"
            echo "$unformatted"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        env:
          TF_TEST_DATABASE_URL: postgres://tf:tf@localhost:5432/thinkingface?sslmode=disable
        run: go test ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: v2.4.0
          working-directory: backend
          args: --timeout=5m

  frontend:
    name: frontend (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Do not leave the job's GITHUB_TOKEN in .git/config: nothing here
          # pushes, and the later steps run third-party tooling (tygo, bun,
          # pip, docker build) that would otherwise have a credential within
          # reach.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          # Pinned rather than `latest`: a bun release should break CI on a
          # deliberate bump, not on the morning it ships.
          bun-version: "1.3.14"

      - name: bun install
        run: bun install --frozen-lockfile

      - name: typecheck
        run: bun run typecheck

      - name: lint
        run: bun run lint

      - name: format:check
        run: bun run format:check

      - name: check:ui
        run: bun run check:ui

      - name: test
        run: bun run test

      - name: build
        run: bun run build

  contract:
    name: contract (tygo type sync)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Do not leave the job's GITHUB_TOKEN in .git/config: nothing here
          # pushes, and the later steps run third-party tooling (tygo, bun,
          # pip, docker build) that would otherwise have a credential within
          # reach.
          persist-credentials: false

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # `git status --porcelain`, not `git diff --exit-code`: diff only inspects
      # *tracked* files, so an api.gen.ts that exists but was never committed
      # would make this job pass while the frontend has no generated types at
      # all. --porcelain reports modified, untracked and deleted alike.
      - name: Regenerate api.gen.ts and verify it is committed in sync
        run: |
          set -euo pipefail
          test -f frontend/types/api.gen.ts || {
            echo "::error::frontend/types/api.gen.ts is missing from the repository. Commit the result of 'make gen-types'"
            exit 1
          }
          git ls-files --error-unmatch frontend/types/api.gen.ts >/dev/null || {
            echo "::error::frontend/types/api.gen.ts is not tracked by git. Run 'git add frontend/types/api.gen.ts' and commit it"
            exit 1
          }
          backend/scripts/gen-types.sh
          status="$(git status --porcelain -- frontend/types/api.gen.ts)"
          if [ -n "$status" ]; then
            echo "$status"
            git --no-pager diff -- frontend/types/api.gen.ts || true
            echo "::error::frontend/types/api.gen.ts is out of sync with the Go types (backend/internal/apitypes). Run 'make gen-types' and commit the result"
            exit 1
          fi

  python:
    name: python (ruff + clients/python unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Do not leave the job's GITHUB_TOKEN in .git/config: nothing here
          # pushes, and the later steps run third-party tooling (tygo, bun,
          # pip, docker build) that would otherwise have a credential within
          # reach.
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          # Pinned like every other tool here: uv resolves and verifies the
          # Python dependency sets, so it should not change under us silently.
          version: "0.12.5"

      - name: Install ruff
        # --require-hashes: requirements-lint.txt is generated by
        # `make lock-python` and pins every package with a sha256, so pip
        # refuses to install anything whose bytes do not match. A registry
        # that serves different content for the same version -- the tail end
        # of most supply chain attacks -- fails here instead of running.
        run: pip install --require-hashes -r requirements-lint.txt

      - name: Verify e2e's lockfile is in sync with pyproject.toml
        # `uv run --locked` in the e2e job would fail on a drifted lockfile
        # too, but that job only runs on main. Checking it here means a PR
        # that edits e2e/pyproject.toml without running `make lock-python`
        # fails immediately, rather than after the merge.
        working-directory: e2e
        run: uv lock --check

      - name: Verify clients/python's lockfile is in sync with pyproject.toml
        # The pytest step below uses --locked and would catch this too; a
        # dedicated step just makes "you edited pyproject.toml without running
        # make lock-python" readable in the job summary.
        working-directory: clients/python
        run: uv lock --check

      - name: ruff check
        run: ruff check e2e clients/python scripts

      - name: ruff format --check
        run: ruff format --check e2e clients/python scripts

      # The clients/python unit suite (trackio resume contract, run grouping,
      # artifact upload, system metrics). These are pure unit tests -- no
      # server and no docker -- so unlike the e2e job they belong on every PR.
      #
      # --locked installs the exact versions and hashes clients/python/uv.lock
      # records and fails if the lockfile and pyproject.toml have drifted
      # apart, so nothing here lets a registry choose a version. The `dev`
      # dependency group is pytest only: the transformers / lightning extras
      # are deliberately absent because tests/test_trackio_integrations.py
      # asserts the autolog integrations import cleanly without them.
      - name: pytest (clients/python)
        working-directory: clients/python
        run: uv run --locked pytest -v

  terraform:
    name: terraform (infra)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra
    # Static checks only, and that limit is worth being explicit about:
    # `terraform validate` resolves the providers and checks the configuration
    # against their *schemas* -- syntax, argument names, types, references. It
    # never talks to GCP, so every server-side constraint is invisible to it.
    # Cloud Run, for example, allows at most 4 GiB of memory per vCPU, so a
    # service asking for 8 GiB on 1 vCPU validates cleanly here and is rejected
    # at apply time. A green job means "this configuration is well-formed", not
    # "this configuration will apply".
    #
    # `terraform plan` / `apply` are deliberately absent: both need GCP
    # credentials, which this workflow does not have and should not be given.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Do not leave the job's GITHUB_TOKEN in .git/config: nothing here
          # pushes, and the later steps run third-party tooling (tygo, bun,
          # pip, docker build) that would otherwise have a credential within
          # reach.
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          # Pinned rather than `latest`, like bun and golangci-lint above: a
          # terraform release should break CI on a deliberate bump, not on the
          # morning it ships. Keep this at or above infra/versions.tf's
          # required_version.
          terraform_version: "1.15.4"
          # The default wrapper re-emits stdout/stderr as step outputs, which
          # nothing here consumes; without it the log is the plain CLI output.
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      # -backend=false: the real backend needs credentials and nothing here
      # touches state. Providers are still installed (from the committed
      # .terraform.lock.hcl), which is what validate needs.
      - name: terraform init
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

  e2e:
    name: e2e (huggingface_hub compat, ${{ matrix.backend }})
    # The compatibility suite is the only thing that checks CLAUDE.md's
    # invariant 5 -- that whoami / create_repo / preupload / commit / resolve /
    # tree / LFS batch still behave the way huggingface_hub, datasets, git and
    # gcloud expect. It used to run only after a merge, which meant a pull
    # request that broke compatibility went green and failed on main
    # afterwards, with the invariant resting entirely on the author
    # remembering to run `make test-e2e` locally.
    #
    # It is a heavy job, so it is still not run for every pull request: the
    # `changes` job above decides, from the diff, whether this one can be
    # skipped. The two matrix legs run concurrently and take about as long as
    # the backend job, so a pull request that does need them is barely slower
    # end to end.
    needs: changes
    # !cancelled() rather than always(): the `changes` job is skipped outright
    # on push and dispatch, and a skipped dependency would otherwise skip this
    # job too -- but a cancelled workflow should still cancel it.
    if: >-
      !cancelled() && (
        github.event_name == 'workflow_dispatch'
        || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        || (github.event_name == 'pull_request' && needs.changes.outputs.e2e == 'true')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Exercises both the PostgreSQL and SQLite paths via DATABASE_URL's scheme.
        backend: [postgres, sqlite]
    env:
      # sqlite layers docker-compose.sqlite.yml on top (equivalent to `make up-sqlite`).
      # postgres uses only docker-compose.yml.
      COMPOSE_ARGS: >-
        ${{ matrix.backend == 'sqlite' && '-f docker-compose.yml -f docker-compose.sqlite.yml' || '-f docker-compose.yml' }}
      COMPOSE_SERVICES: >-
        ${{ matrix.backend == 'sqlite' && 'api web gcs' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Do not leave the job's GITHUB_TOKEN in .git/config: nothing here
          # pushes, and the later steps run third-party tooling (tygo, bun,
          # pip, docker build) that would otherwise have a credential within
          # reach.
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: "0.12.5"

      - name: Prepare .env
        run: cp .env.example .env

      - name: docker compose up
        run: docker compose $COMPOSE_ARGS up -d --build $COMPOSE_SERVICES

      - name: Wait for the API to become healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/healthz >/dev/null 2>&1; then
              echo "api is healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::api did not become healthy in time"
          docker compose $COMPOSE_ARGS ps
          docker compose $COMPOSE_ARGS logs --no-color
          exit 1

      # e2e/uv.lock, not a `>=` requirements file: the suite pulls in
      # huggingface_hub / datasets / pyarrow and their whole transitive tree,
      # which used to be resolved fresh on every run. --locked installs the
      # exact versions and hashes the lockfile records, and fails if the
      # lockfile and pyproject.toml have drifted apart.
      - name: pytest
        working-directory: e2e
        run: uv run --locked pytest -v

      - name: Dump service logs on failure
        if: failure()
        run: docker compose $COMPOSE_ARGS logs --no-color

      - name: docker compose down
        if: always()
        run: docker compose $COMPOSE_ARGS down -v
