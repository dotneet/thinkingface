name: docs

# Builds docs/users/ with MkDocs and publishes it to GitHub Pages.
# docs/dev/ holds the internal design documents and is not part of the site
# (mkdocs.yml points docs_dir at docs/users).
#
# Actions are pinned to a commit SHA rather than a tag, and the trailing
# comment carries the readable version -- see the note at the top of ci.yml
# and docs/dev/supply-chain.md.

on:
  push:
    branches: [main]
    paths:
      - "docs/users/**"
      - "docs/requirements.in"
      - "docs/requirements.txt"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/users/**"
      - "docs/requirements.in"
      - "docs/requirements.txt"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build (mkdocs --strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Nothing here pushes, and the build runs third-party tooling.
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install MkDocs
        # --require-hashes: docs/requirements.txt is generated by
        # `make lock-python` and pins every transitive package with a sha256.
        # pip installs those exact bytes or fails.
        run: pip install --require-hashes -r docs/requirements.txt

      # --strict turns broken internal links and other warnings into failures,
      # so a bad link fails the PR instead of shipping a 404.
      - name: Build
        run: mkdocs build --strict

      # --strict cannot detect en/ja anchor parity (mkdocs reports a broken
      # anchor only at INFO level), so check the translated heading anchors
      # explicitly -- same as `make check-doc-anchors`.
      - name: Check ja anchor parity
        run: python3 scripts/check-doc-anchors.py

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: site

  deploy:
    name: deploy (github-pages)
    # Only main publishes -- asserted on the ref, not on the event. The
    # `push` trigger above is already branch-restricted, but
    # `workflow_dispatch` is not: an "event is not pull_request" test let a
    # maintainer building the docs from a feature branch replace the live
    # site, and nothing about that run would have looked wrong.
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
