# Project definition for the E2E test suite.
#
# This file plus uv.lock is the whole dependency set: `uv run --locked` (what
# `make test-e2e` runs) resolves from the lockfile and fails rather than
# re-resolving if the two have drifted apart. After editing the dependencies
# below, run `uv lock` here or `make lock-python` from the repo root, and commit
# the regenerated uv.lock. See docs/dev/supply-chain.md.

[project]
name = "thinkingface-e2e"
version = "0.1.0"
description = "End-to-end huggingface_hub / datasets / git / GCS compatibility suite for thinkingface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8.0",
    "huggingface_hub>=0.24",
    "datasets>=2.19",
    "pyarrow>=14.0",
    "requests>=2.31",
]

[tool.uv]
# This is a test suite, not an installable package.
package = false

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "W",   # pycodestyle warnings
]
ignore = [
    "E501",  # Leave line length to the formatter
]

[tool.ruff.format]
quote-style = "double"
