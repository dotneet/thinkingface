site_name: thinkingface
site_description: Self-hosted Hugging Face Hub — datasets, models, and experiment tracking on your own storage.
site_url: https://dotneet.github.io/thinkingface/
repo_url: https://github.com/dotneet/thinkingface
repo_name: dotneet/thinkingface

# Only the user-facing docs are published. docs/dev/ holds the internal design
# documents and is deliberately outside docs_dir.
docs_dir: docs/users
site_dir: site
edit_uri: edit/main/docs/users/

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  # i18n first: it rewrites the file set (docs_structure: suffix picks *.ja.md
  # out of docs/users/ and builds them under /ja/), and reconfigures material's
  # language switcher and the search plugin for every locale.
  - i18n:
      docs_structure: suffix
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: ja
          name: 日本語
          build: true
          site_name: thinkingface
          site_description: セルフホスト型の Hugging Face Hub — データセット・モデル・実験を自分たちのストレージで。
          nav_translations:
            Home: ホーム
            Getting Started: はじめる
            Quickstart: クイックスタート
            Core Concepts: 基本コンセプト
            Guides: ガイド
            Uploading Files: ファイルのアップロード
            Downloading Files: ファイルのダウンロード
            Working with Git: Git を使う
            Browsing the Web UI: Web UI を使う
            Viewing Datasets: データセットの閲覧
            Inspecting Models: モデルの確認
            Tracking Experiments: 実験のトラッキング
            Organizations: Organization
            Webhooks: Webhook
            Reference: リファレンス
            # Intentionally identical: `tf` is a command name, and the Japanese
            # page's own H1 is "tf CLI" too. The key is listed anyway so the
            # gap is a decision on the record rather than a missing entry.
            tf CLI: tf CLI
            Authentication: 認証
            Compatibility: 互換性
            Self-hosting: セルフホスト
            Deployment: デプロイ
            Configuration: 設定
  - search

# Broken internal links fail the build instead of shipping a 404.
validation:
  links:
    absolute_links: relative_to_docs
    unrecognized_links: warn

nav:
  - Home: index.md
  - Getting Started:
      - Quickstart: getting-started.md
      - Core Concepts: concepts.md
  - Guides:
      - Uploading Files: guides/uploading.md
      - Downloading Files: guides/downloading.md
      - Working with Git: guides/git.md
      - Browsing the Web UI: guides/web-ui.md
      - Viewing Datasets: guides/dataset-viewer.md
      - Inspecting Models: guides/model-checkpoints.md
      - Tracking Experiments: guides/experiments.md
      - Organizations: guides/organizations.md
      - Webhooks: guides/webhooks.md
  - Reference:
      - tf CLI: reference/tf-cli.md
      - Authentication: reference/authentication.md
      - Compatibility: reference/compatibility.md
  - Self-hosting:
      - Deployment: self-hosting/deployment.md
      - Configuration: self-hosting/configuration.md
